name: PF Alerta de citas

on:
  schedule:
    - cron: '*/30 * * * *'  # cada 30 min (repo privado: 2000 min/mes gratis; GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write           # para guardar estado.json

concurrency:
  group: pf-alerta
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Consultar citas
        run: node pf-alerta.js --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: $(jq -r .estado estado.json)"
            git push
          fi
