name: PF Alerta de citas

on:
  # El horario automático corre en alwaysdata (cada 5 min). Para volver a GitHub:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:        # botón "Run workflow" (manual) o cron-job.org (origen=cron)
    inputs:
      origen:
        description: "manual o cron"
        default: "manual"
        required: false

permissions:
  contents: write           # para guardar estado.json

concurrency:
  group: pf-alerta
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Consultar citas
        run: node pf-alerta.js --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORZAR_LATIDO: ${{ github.event_name == 'workflow_dispatch' && inputs.origen != 'cron' }}
          ORIGEN: ${{ inputs.origen }}

      - name: Guardar estado si ha cambiado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: $(jq -r .estado estado.json)"
            # reintenta si alguien subió cambios mientras tanto
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
